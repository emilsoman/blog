<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/app.css" />

    <title>
      {% if title %}{{ title }} | Emil Soman{% else %}Emil Soman{% endif %}
    </title>
    <link rel="canonical" href="{{ page.url }}" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-B9SDVWTHSX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-B9SDVWTHSX");
    </script>
  </head>
  <body>
    <section id="nav">
      <h1><a href="/">Emil Soman</a></h1>
      <p class="site-description">
        Programmer, founder. Building a vertical AI agent in e-commerce. YC alum.
        <br />
        I mostly talk about tech and startups.
        <br />
        Linkedin
        <a href="https://www.linkedin.com/in/emilsoman/">/emilsoman</a>.
      </p>
    </section>
    <section id="content">
      {% if tags contains "post" %}
      <h1>{{ title }}</h1>

      <div id="sub-header">{{ date | date: "%Y/%m/%d" }}</div>
      <div class="entry-content">{{ content }}</div>
      {% else %} {{ content }} {% endif %}
    </section>
  </body>
</html>
